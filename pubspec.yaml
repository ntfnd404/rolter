name: rolter
description: "A typed, tree-based Flutter router with deep linking, nested navigation, guards, and external Page composition."
version: 0.4.0

homepage: https://github.com/ntfnd404/rolter
repository: https://github.com/ntfnd404/rolter
issue_tracker: https://github.com/ntfnd404/rolter/issues

topics:
  - deep-linking
  - navigation
  - navigator
  - nested-navigation
  - router

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

screenshots:
  - description: Architecture of typed routes, guards, explicit page composition, and root and nested navigators.
    path: screenshots/architecture.webp
  - description: Opening a nested deep link and navigating back through nested and root stacks.
    path: screenshots/deep_link_nested_back.gif
