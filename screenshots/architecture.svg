<!-- Source of truth: manually derive architecture.webp from this file; never edit the WEBP independently. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker
      id="arrow-chevron"
      markerWidth="12"
      markerHeight="12"
      refX="11"
      refY="6"
      orient="auto"
      markerUnits="userSpaceOnUse"
      viewBox="0 0 12 12"
      overflow="visible"
    >
      <path
        d="M 1 1 L 11 6 L 1 11"
        fill="none"
        stroke="#91a4c4"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #65a8ff; }
      .tagline { font: 400 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #aebbd1; }
      .heading { font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f4f7fc; }
      .detail { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #aebbd1; }
      .footer { font: 700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f4f7fc; }
      .wire-label { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #aebbd1; }
      .card { fill: #1b2d4b; }
      .connector {
        fill: none;
        stroke: #91a4c4;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-chevron);
      }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#0e1a2f"/>

  <text x="55" y="66" class="title">ROLTER</text>
  <text x="188" y="66" class="tagline">typed, URL-serializable navigation</text>

  <g aria-label="Entry URL">
    <rect class="card" x="55" y="130" width="320" height="155" rx="18"/>
    <rect x="55" y="130" width="8" height="155" fill="#4d9cff"/>
    <text x="85" y="171" class="heading">ENTRY URL</text>
    <text x="85" y="208" class="detail">deep link / restore</text>
    <text x="85" y="236" class="detail">query parameters</text>
  </g>

  <g aria-label="Route codec">
    <rect class="card" x="540" y="130" width="320" height="155" rx="18"/>
    <rect x="540" y="130" width="8" height="155" fill="#4d9cff"/>
    <text x="570" y="171" class="heading">ROUTE CODEC</text>
    <text x="570" y="208" class="detail">TreeUrlCodec</text>
    <text x="570" y="236" class="detail">Base64RouteCodec</text>
  </g>

  <g aria-label="Typed route tree">
    <rect class="card" x="1025" y="130" width="320" height="155" rx="18"/>
    <rect x="1025" y="130" width="8" height="155" fill="#48d7a0"/>
    <text x="1055" y="171" class="heading">TYPED TREE</text>
    <text x="1055" y="208" class="detail">RouteNode data only</text>
    <text x="1055" y="236" class="detail">RouteRegistry + namespaces</text>
  </g>

  <line class="connector" x1="375" y1="208" x2="525" y2="208"/>
  <line class="connector" x1="860" y1="208" x2="1010" y2="208"/>
  <line class="connector" x1="1185" y1="285" x2="1185" y2="395"/>

  <g aria-label="Navigators">
    <rect class="card" x="55" y="410" width="280" height="170" rx="18"/>
    <rect x="55" y="410" width="8" height="170" fill="#4d9cff"/>
    <text x="85" y="452" class="heading">NAVIGATORS</text>
    <text x="85" y="489" class="detail">root Navigator 2.0</text>
    <text x="85" y="517" class="detail">nested stacks</text>
    <text x="85" y="545" class="detail">custom pages</text>
  </g>

  <g aria-label="Page composition">
    <rect class="card" x="380" y="410" width="280" height="170" rx="18"/>
    <rect x="380" y="410" width="8" height="170" fill="#65d6ff"/>
    <text x="410" y="452" class="heading">PAGE COMPOSITION</text>
    <text x="410" y="489" class="detail">external strategy</text>
    <text x="410" y="517" class="detail">PageRouteNode adapter</text>
    <text x="410" y="545" class="detail">pageKey validation</text>
  </g>

  <g aria-label="Routes state">
    <rect class="card" x="705" y="410" width="280" height="170" rx="18"/>
    <rect x="705" y="410" width="8" height="170" fill="#48d7a0"/>
    <text x="735" y="452" class="heading">ROUTES STATE</text>
    <text x="735" y="489" class="detail">single source of truth</text>
    <text x="735" y="517" class="detail">serialized queue</text>
    <text x="735" y="545" class="detail">history + observers</text>
  </g>

  <g aria-label="Guard pipeline">
    <rect class="card" x="1030" y="410" width="315" height="170" rx="18"/>
    <rect x="1030" y="410" width="8" height="170" fill="#ffc15c"/>
    <text x="1060" y="452" class="heading">GUARD PIPELINE</text>
    <text x="1060" y="489" class="detail">redirect / cancel</text>
    <text x="1060" y="517" class="detail">bounded re-settlement</text>
    <text x="1060" y="545" class="detail">PendingLocation</text>
  </g>

  <line class="connector" x1="1030" y1="495" x2="1000" y2="495"/>
  <line class="connector" x1="705" y1="495" x2="675" y2="495"/>
  <line class="connector" x1="380" y1="495" x2="350" y2="495"/>

  <line class="connector" x1="1030" y1="650" x2="350" y2="650"/>
  <text x="872" y="678" class="wire-label">encode current wire format</text>
  <text x="445" y="720" class="footer">root + nested back update the same route tree</text>
</svg>
